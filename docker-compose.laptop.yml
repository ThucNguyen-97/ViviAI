################################################################################
# docker-compose.laptop.yml
# Tầng Enterprise Knowledge — chạy trên Laptop Windows
#
# Services:
#   postgres   : PostgreSQL 16 + pgvector
#   redis-ek   : Redis (cache/session cho EK service)
#   ek-service : FastAPI skeleton (sẽ được phát triển ở Giai đoạn 1)
#
# Cách chạy:
#   docker compose -f docker-compose.laptop.yml up -d
#   docker compose -f docker-compose.laptop.yml ps
#   docker compose -f docker-compose.laptop.yml logs -f
#   docker compose -f docker-compose.laptop.yml down
################################################################################

version: "3.9"

services:

  # ── PostgreSQL 16 + pgvector ────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vietmas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vietmas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-vietmas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/enterprise_knowledge/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vietmas} -d ${POSTGRES_DB:-vietmas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ek-net

  # ── Redis (Enterprise Knowledge) ────────────────────────────
  redis-ek:
    image: redis:7-alpine
    container_name: vietmas-redis-ek
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_EK_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_ek_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_EK_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ek-net

  # ── Enterprise Knowledge Service (FastAPI) ──────────────────
  ek-service:
    build:
      context: ./backend/enterprise_knowledge
      dockerfile: Dockerfile
    container_name: vietmas-ek-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vietmas}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-vietmas_db}
      REDIS_URL: redis://:${REDIS_EK_PASSWORD:-changeme}@redis-ek:6379/0
      EK_INTERNAL_API_KEY: ${EK_INTERNAL_API_KEY:-changeme_internal_api_key}
      APP_ENV: ${APP_ENV:-development}
      USD_TO_VND_RATE: ${USD_TO_VND_RATE:-26200}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_LLM_MODEL: ${GOOGLE_LLM_MODEL:-gemini-3.1-flash-lite}
      ANTHROPIC_LLM_MODEL: ${ANTHROPIC_LLM_MODEL:-claude-sonnet-5}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-5}
      RAG_DEFAULT_SCORE_THRESHOLD: ${RAG_DEFAULT_SCORE_THRESHOLD:-0.7}
    volumes:
      - ./backend/enterprise_knowledge:/app
      - ./backend/vm_service/storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis-ek:
        condition: service_healthy
    networks:
      - ek-net

volumes:
  postgres_data:
  redis_ek_data:

networks:
  ek-net:
    driver: bridge
